<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paperbound</title>
  <style>
    :root { --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --muted: #52525b; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f5; color: #18181b; }
    header { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem; background: #fff; border-bottom: 1px solid #e4e4e7; position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 1.1rem; margin: 0; }
    #status { color: var(--muted); font-size: .9rem; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 1rem; padding: 1rem; align-items: start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    #pages { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .page { position: relative; box-shadow: 0 1px 4px rgba(0,0,0,.2); background: #fff; max-width: 100%; }
    .page img { display: block; width: 100%; height: auto; }
    .word { position: absolute; box-sizing: border-box; border: 1px solid transparent; }
    .word:hover { background: rgba(59,130,246,.25); border-color: #2563eb; }
    .hl { position: absolute; box-sizing: border-box; border: 2px solid #ea580c; background: rgba(251,146,60,.3); pointer-events: none; border-radius: 2px; }
    #tip { position: fixed; pointer-events: none; background: #18181b; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: .8rem; display: none; z-index: 10; }
    aside { display: flex; flex-direction: column; gap: 1rem; position: sticky; top: 56px; max-height: calc(100vh - 72px); overflow-y: auto; }
    section.card { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: .75rem; }
    section.card h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 .5rem; }
    .step { display: grid; grid-template-columns: 1.2rem 1fr auto; gap: .4rem; font-size: .88rem; padding: .3rem 0; border-top: 1px solid #f0f0f2; }
    .step:first-of-type { border-top: 0; }
    .step .reason { grid-column: 2 / 4; color: var(--muted); font-size: .8rem; }
    .step .error { grid-column: 2 / 4; color: var(--bad); font-size: .8rem; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; margin-top: .25rem; background: var(--ok); }
    .dot.failed { background: var(--bad); } .dot.skipped { background: #a1a1aa; }
    .meta { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8rem; }
    .field { padding: .4rem .3rem; border-radius: 6px; cursor: pointer; border-top: 1px solid #f0f0f2; }
    .field:hover, .field.active { background: #fff7ed; }
    .field .name { font-size: .75rem; color: var(--muted); }
    .field .value { font-weight: 600; word-break: break-word; }
    .conf { float: right; font-size: .78rem; font-weight: 600; padding: 0 .4rem; border-radius: 999px; color: #fff; }
    .conf.hi { background: var(--ok); } .conf.mid { background: var(--warn); } .conf.lo { background: var(--bad); }
    .flag { display: inline-block; font-size: .7rem; background: #fee2e2; color: var(--bad); border-radius: 4px; padding: 0 .3rem; margin: .2rem .2rem 0 0; }
    .obligation { font-size: .92rem; }
    .obligation .due { font-weight: 700; font-size: 1.05rem; }
    .empty { color: var(--muted); font-size: .85rem; }
    .action { padding: .5rem 0; border-top: 1px solid #f0f0f2; font-size: .88rem; }
    .action:first-of-type { border-top: 0; }
    .action .head { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
    .action .tool { font-weight: 700; }
    .badge { font-size: .72rem; border-radius: 999px; padding: 0 .5rem; background: #e4e4e7; }
    .badge.pending { background: #fef3c7; color: var(--warn); } .badge.executed { background: #dcfce7; color: var(--ok); }
    .badge.rejected, .badge.failed { background: #fee2e2; color: var(--bad); }
    .args { margin: .3rem 0; display: grid; grid-template-columns: auto 1fr; gap: .1rem .5rem; font-size: .82rem; }
    .args dt { color: var(--muted); } .args dd { margin: 0; word-break: break-word; white-space: pre-wrap; }
    .why, .policy { color: var(--muted); font-size: .78rem; margin: .15rem 0; }
    .src { background: none; border: 0; padding: 0; color: #2563eb; cursor: pointer; font: inherit; font-size: .78rem; text-decoration: underline; margin-right: .5rem; }
    .btns { margin-top: .35rem; display: flex; gap: .4rem; }
    .btns button { font: inherit; font-size: .82rem; padding: .15rem .7rem; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; }
    .btns button.approve { background: var(--ok); color: #fff; border-color: var(--ok); }
    .sandbox-note { font-size: .75rem; color: var(--muted); margin: 0 0 .4rem; }
    .sbx { border: 1px dashed #d4d4d8; border-radius: 6px; padding: .4rem .5rem; margin-bottom: .4rem; font-size: .84rem; }
    .sbx .kind { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .brief-line { display: grid; grid-template-columns: 1fr auto; gap: .1rem .5rem; padding: .3rem .3rem; border-top: 1px solid #f0f0f2; border-radius: 6px; cursor: pointer; }
    .brief-line:first-of-type { border-top: 0; }
    .brief-line:hover, .brief-line.active { background: #fff7ed; }
    .brief-line .label { font-size: .78rem; color: var(--muted); }
    .brief-line .num { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .brief-line .note { grid-column: 1 / 3; font-size: .72rem; color: var(--muted); }
    .brief-line .cites { grid-column: 1 / 3; }
    .brief-skipped { font-size: .78rem; color: var(--muted); margin-top: .4rem; }
    .group { border: 1px solid #e4e4e7; border-radius: 8px; padding: .4rem .5rem; margin: .5rem 0; background: #fafafa; }
    .group > .ghead { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-weight: 700; font-size: .88rem; }
    .group > .gnote { color: var(--muted); font-size: .76rem; margin: .1rem 0 .2rem; }
    .group .action { border-top: 1px solid #e4e4e7; }
    .group .action:first-of-type { border-top: 0; }
    .typechip { display: inline-block; font-weight: 700; padding: .05rem .6rem; border-radius: 999px; background: #e0e7ff; color: #3730a3; }
    .typechip.other { background: #fee2e2; color: var(--bad); }
    .notice { margin-top: .4rem; padding: .4rem .5rem; border-radius: 6px; background: #fef3c7; color: var(--warn); font-size: .85rem; }
    .sbx .body { white-space: pre-wrap; color: #3f3f46; margin-top: .2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Paperbound</h1>
    <input type="file" id="file" accept="application/pdf">
    <span id="status"></span>
  </header>
  <main>
    <div id="pages"></div>
    <aside id="panel" hidden>
      <section class="card"><h2>Document type</h2><div id="doctype"></div></section>
      <section class="card"><h2>Run timeline</h2><div id="steps"></div></section>
      <section class="card"><h2>Fields</h2><div id="fields"></div></section>
      <section class="card"><h2>Obligations</h2><div id="obligations"></div></section>
      <section class="card"><h2>Decision brief</h2><div id="brief"></div></section>
      <section class="card"><h2>Proposed actions</h2><div id="actions"></div></section>
      <section class="card"><h2>Sandbox</h2>
        <p class="sandbox-note">Approved actions run in a sandbox. Nothing is sent or saved outside this app.</p>
        <div id="sandbox"></div>
      </section>
    </aside>
  </main>
  <div id="tip"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const tip = $('tip');
    const pageEls = {};    // page_no -> {wrap, page}
    let activeHighlights = [];
    let currentRun = null;

    // All text from the document or the model is inserted with textContent, never as HTML.
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    $('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      $('pages').replaceChildren();
      $('panel').hidden = true;
      $('status').textContent = 'Uploading, parsing, extracting and planning...';
      try {
        const form = new FormData();
        form.append('file', file);
        const res = await fetch('/documents', { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
        await showRun(await res.json());
      } catch (err) {
        $('status').textContent = 'Error: ' + err.message;
      }
    });

    // doc = {document_id, run_id, status, page_count, reused?}
    async function showRun(doc) {
      $('pages').replaceChildren();
      for (const k of Object.keys(pageEls)) delete pageEls[k];
      activeHighlights = [];
      $('status').textContent = `Document ${doc.document_id}, run ${doc.run_id} (${doc.status}), ${doc.page_count} page(s)` +
        (doc.reused ? ', file already parsed' : '');
      for (let n = 1; n <= doc.page_count; n++) {
        renderPage(await (await fetch(`/documents/${doc.document_id}/pages/${n}`)).json());
      }
      currentRun = doc.run_id;
      renderDocType(await (await fetch(`/runs/${doc.run_id}`)).json());
      const [steps, fields, obligations] = await Promise.all(
        ['steps', 'fields', 'obligations'].map((k) => fetch(`/runs/${doc.run_id}/${k}`).then((r) => r.json()))
      );
      renderSteps(steps);
      renderFields(fields);
      renderObligations(obligations);
      await loadActions();
      $('panel').hidden = false;
    }

    // Links like /#run=7&page=3 (written into reminders) open that run and scroll to the page.
    async function applyHash() {
      const m = /^#run=(\d+)(?:&page=(\d+))?$/.exec(location.hash);
      if (!m) return;
      try {
        if (Number(m[1]) !== currentRun) {
          const res = await fetch(`/runs/${m[1]}`);
          if (!res.ok) throw new Error('Run not found');
          const run = await res.json();
          await showRun({ document_id: run.document_id, run_id: run.id, status: run.status, page_count: run.page_count });
        }
        const target = pageEls[Number(m[2])];
        if (target) target.wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        $('status').textContent = 'Error: ' + err.message;
      }
    }
    window.addEventListener('hashchange', applyHash);
    window.addEventListener('load', applyHash);

    function renderPage(page) {
      const wrap = document.createElement('div');
      wrap.className = 'page';
      wrap.style.width = Math.round(page.width_pt * 1.33) + 'px';
      const img = document.createElement('img');
      img.src = page.image_url;
      wrap.appendChild(img);
      for (const w of page.words) {
        const box = placeBox(wrap, page, w.bbox, 'word');
        box.addEventListener('mouseenter', () => { tip.textContent = w.text; tip.style.display = 'block'; });
        box.addEventListener('mousemove', (ev) => { tip.style.left = ev.clientX + 12 + 'px'; tip.style.top = ev.clientY + 12 + 'px'; });
        box.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      }
      $('pages').appendChild(wrap);
      pageEls[page.page_no] = { wrap, page };
    }

    function placeBox(wrap, page, bbox, cls) {
      const [x0, y0, x1, y1] = bbox;
      const box = document.createElement('div');
      box.className = cls;
      box.style.left = (x0 / page.width_pt * 100) + '%';
      box.style.top = (y0 / page.height_pt * 100) + '%';
      box.style.width = ((x1 - x0) / page.width_pt * 100) + '%';
      box.style.height = ((y1 - y0) / page.height_pt * 100) + '%';
      wrap.appendChild(box);
      return box;
    }

    // Draws one box per matched line and scrolls to the first one. Takes anything shaped like {page_no, bboxes}:
    // a field, or ONE action source. Pass a list only to show several sources at once.
    function highlight(items) {
      activeHighlights.forEach((n) => n.remove());
      activeHighlights = [];
      let first = null;
      for (const item of [].concat(items)) {
        const target = pageEls[item.page_no];
        if (!target) continue;
        const boxes = item.bboxes && item.bboxes.length ? item.bboxes : (item.bbox ? [item.bbox] : []);
        for (const b of boxes) {
          const box = placeBox(target.wrap, target.page, b, 'hl');
          activeHighlights.push(box);
          first = first || box;
        }
        first = first || target.wrap;
      }
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // One link per source: it highlights that source's own page and boxes, not the whole list.
    function sourceLinks(sources, prefix) {
      const wrap = el('div', 'why', prefix);
      for (const src of sources) {
        const link = el('button', 'src', `page ${src.page_no} (${src.name})`);
        link.type = 'button';
        link.addEventListener('click', (ev) => { ev.stopPropagation(); highlight(src); });
        wrap.appendChild(link);
      }
      return wrap;
    }

    // Text with /#run=N&page=M links turned into anchors, built with DOM nodes, never innerHTML.
    function linkify(text) {
      const box = el('span');
      let last = 0;
      for (const m of text.matchAll(/\/#run=\d+&page=\d+/g)) {
        box.appendChild(document.createTextNode(text.slice(last, m.index)));
        const a = el('a', '', m[0]);
        a.href = m[0];
        box.appendChild(a);
        last = m.index + m[0].length;
      }
      box.appendChild(document.createTextNode(text.slice(last)));
      return box;
    }

    const TYPE_LABELS = { lease: 'Commercial lease', insurance_certificate: 'Certificate of liability insurance', other: 'Other' };

    function renderDocType(run) {
      const root = $('doctype');
      root.replaceChildren();
      const type = run.doc_type || 'lease';  // runs saved before classification existed are leases
      root.appendChild(el('span', 'typechip' + (type === 'other' ? ' other' : ''), TYPE_LABELS[type] || type));
      if (run.classification) {
        root.appendChild(el('div', 'meta', run.classification.summary || ''));
        root.appendChild(el('div', 'why', run.classification.reason || ''));
      }
      if (run.message) root.appendChild(el('div', 'notice', run.message.charAt(0).toUpperCase() + run.message.slice(1) + '.'));
    }

    function renderSteps(steps) {
      const root = $('steps');
      root.replaceChildren();
      for (const s of steps) {
        const row = el('div', 'step');
        row.appendChild(el('span', 'dot ' + s.status));
        row.appendChild(el('span', '', `${s.stage}${s.summary ? ': ' + s.summary : ''}`));
        const cost = s.cost_usd ? ` · ${s.tokens} tok · $${s.cost_usd.toFixed(5)}` : '';
        row.appendChild(el('span', 'meta', `${s.duration_ms} ms${cost}`));
        if (s.reason) row.appendChild(el('span', 'reason', s.reason));
        if (s.error) row.appendChild(el('span', 'error', s.error));
        root.appendChild(row);
      }
    }

    function confClass(c) { return c >= 0.9 ? 'hi' : c >= 0.7 ? 'mid' : 'lo'; }

    function renderFields(fields) {
      const root = $('fields');
      root.replaceChildren();
      for (const f of fields) {
        const row = el('div', 'field');
        row.appendChild(el('span', 'conf ' + confClass(f.confidence ?? 0), (f.confidence ?? 0).toFixed(2)));
        row.appendChild(el('div', 'name', f.name + (f.page_no ? ` · page ${f.page_no}` : '')));
        row.appendChild(el('div', 'value', f.value === null ? '(not found)' : String(f.value)));
        for (const flag of f.flags) row.appendChild(el('span', 'flag', flag));
        row.addEventListener('click', () => {
          document.querySelectorAll('.field.active').forEach((n) => n.classList.remove('active'));
          row.classList.add('active');
          highlight(f);
        });
        root.appendChild(row);
      }
    }

    function renderObligations(obligations) {
      const root = $('obligations');
      root.replaceChildren();
      if (!obligations.length) {
        root.appendChild(el('div', 'empty', 'No obligations derived (see the obligations step above for why).'));
        return;
      }
      for (const o of obligations) {
        const row = el('div', 'obligation');
        row.appendChild(el('div', 'due', o.due_date));
        row.appendChild(el('div', '', o.description));
        root.appendChild(row);
      }
    }

    async function loadBrief() {
      const root = $('brief');
      root.replaceChildren();
      const brief = await (await fetch(`/runs/${currentRun}/brief`)).json();
      if (!brief.lines.length) root.appendChild(el('div', 'empty', 'No numbers could be computed from grounded fields.'));
      for (const ln of brief.lines) {
        const row = el('div', 'brief-line');
        row.appendChild(el('span', 'label', ln.label));
        row.appendChild(el('span', 'num', ln.text));
        if (ln.note) row.appendChild(el('span', 'note', ln.note));
        const cites = sourceLinks(ln.sources, 'from ');
        cites.classList.add('cites');
        row.appendChild(cites);
        row.addEventListener('click', () => {
          document.querySelectorAll('.brief-line.active').forEach((n) => n.classList.remove('active'));
          row.classList.add('active');
          highlight(ln.sources);
        });
        root.appendChild(row);
      }
      if (brief.skipped.length) {
        root.appendChild(el('div', 'brief-skipped', 'Not available: ' + brief.skipped.map((s) => `${s.key} (${s.reason})`).join('; ')));
      }
    }

    async function loadActions() {
      await loadBrief();
      const actions = await (await fetch(`/runs/${currentRun}/actions`)).json();
      renderActions(actions);
      renderSandbox(actions);
    }

    function renderArgs(args) {
      const dl = el('dl', 'args');
      for (const [k, v] of Object.entries(args)) {
        dl.appendChild(el('dt', '', k));
        const dd = el('dd');
        dd.appendChild(typeof v === 'string' ? linkify(v) : document.createTextNode(JSON.stringify(v)));
        dl.appendChild(dd);
      }
      return dl;
    }

    async function decide(id, verb) {
      const res = await fetch(`/actions/${id}/${verb}`, { method: 'POST' });
      if (!res.ok) $('status').textContent = 'Error: ' + ((await res.json()).detail || res.statusText);
    }

    function actionCard(a) {
      const row = el('div', 'action');
      const head = el('div', 'head');
      head.appendChild(el('span', 'tool', a.tool));
      head.appendChild(el('span', 'badge ' + a.status, a.status));
      row.appendChild(head);
      row.appendChild(renderArgs(a.args));
      if (a.rationale) row.appendChild(el('div', 'why', a.rationale));
      row.appendChild(sourceLinks(a.sources, 'because of '));
      if (a.policy_reason) row.appendChild(el('div', 'policy', 'Policy: ' + a.policy_reason));
      if (a.status === 'pending') {
        const btns = el('div', 'btns');
        for (const verb of ['approve', 'reject']) {
          const b = el('button', verb, verb === 'approve' ? 'Approve' : 'Reject');
          b.type = 'button';
          b.addEventListener('click', async () => {
            b.disabled = true;
            await decide(a.id, verb);
            await loadActions();
          });
          btns.appendChild(b);
        }
        row.appendChild(btns);
      }
      return row;
    }

    const GROUP_TITLES = {
      reminders: ['Reminders', 'Staged reminders before the deadline. Approve them together or one by one.'],
      notice_choice: ['Choose one notice', 'Approving one draft rejects the other. Nothing is ever sent.'],
    };

    function renderActions(actions) {
      const root = $('actions');
      root.replaceChildren();
      if (!actions.length) {
        root.appendChild(el('div', 'empty', 'No actions proposed (see the planner step above for why).'));
        return;
      }
      const seen = new Set();
      for (const a of actions) {
        if (!a.group_key) { root.appendChild(actionCard(a)); continue; }
        if (seen.has(a.group_key)) continue;
        seen.add(a.group_key);
        const members = actions.filter((x) => x.group_key === a.group_key);
        const [title, note] = GROUP_TITLES[a.group_key] || [a.group_key, ''];
        const group = el('div', 'group');
        const ghead = el('div', 'ghead');
        ghead.appendChild(el('span', '', `${title} (${members.length})`));
        const pending = members.filter((x) => x.status === 'pending');
        if (a.group_mode === 'bundle' && pending.length > 1) {
          const all = el('button', 'approve', 'Approve all');
          all.type = 'button';
          all.addEventListener('click', async () => {
            all.disabled = true;
            for (const x of pending) await decide(x.id, 'approve');
            await loadActions();
          });
          ghead.appendChild(all);
        }
        group.appendChild(ghead);
        if (note) group.appendChild(el('div', 'gnote', note));
        for (const m of members) group.appendChild(actionCard(m));
        root.appendChild(group);
      }
    }

    function renderSandbox(actions) {
      const root = $('sandbox');
      root.replaceChildren();
      const done = actions.filter((a) => a.status === 'executed' && a.result);
      if (!done.length) {
        root.appendChild(el('div', 'empty', 'Nothing executed yet. Approve an action to see it here.'));
        return;
      }
      for (const a of done) {
        const box = el('div', 'sbx');
        const args = a.args;
        if (a.tool === 'create_calendar_event') {
          box.appendChild(el('div', 'kind', 'Sandbox Calendar'));
          box.appendChild(el('div', '', `${args.date}: ${args.title}`));
          box.appendChild(el('div', 'body', args.description || ''));
        } else if (a.tool === 'draft_email') {
          box.appendChild(el('div', 'kind', 'Sandbox Inbox (draft, not sent)'));
          box.appendChild(el('div', '', `To: ${args.to}`));
          box.appendChild(el('div', '', `Subject: ${args.subject}`));
          box.appendChild(el('div', 'body', args.body));
        } else {
          box.appendChild(el('div', 'kind', 'Sandbox: ' + a.tool));
          box.appendChild(el('div', 'body', JSON.stringify(args, null, 1)));
        }
        box.appendChild(el('div', 'why', a.result.response.status || ''));
        root.appendChild(box);
      }
    }
  </script>
</body>
</html>
